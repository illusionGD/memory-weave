name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      matrix:
        node: ['22.20.0', '22.23.4']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      DATABASE_URL: mysql://memory_weave:ci_database_password@127.0.0.1:3306/memory_weave
      TEST_DATABASE_URL: mysql://root:ci_root_password@127.0.0.1:3306/memory_weave
      QDRANT_URL: http://127.0.0.1:6333
      TEST_QDRANT_URL: http://127.0.0.1:6333
      QDRANT_API_KEY: ci-qdrant-key-for-tests-only
      TEST_QDRANT_API_KEY: ci-qdrant-key-for-tests-only
      ADMIN_PASSWORD: ci-admin-password-for-tests-only
      APP_ORIGIN: http://127.0.0.1:4173
      COOKIE_SECURE: 'false'
      HOST: 127.0.0.1
      PORT: '4173'
      DATA_DIR: ${{ github.workspace }}/.data/ci
    services:
      mysql:
        image: mysql:8.4.9
        env:
          MYSQL_DATABASE: memory_weave
          MYSQL_USER: memory_weave
          MYSQL_PASSWORD: ci_database_password
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      qdrant:
        image: qdrant/qdrant:v1.18.3
        env:
          QDRANT__SERVICE__API_KEY: ci-qdrant-key-for-tests-only
          QDRANT__TELEMETRY_DISABLED: 'true'
        ports:
          - 6333:6333
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node${{ matrix.node }}-pnpm11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node }}-pnpm11-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate the test database
        run: pnpm db:migrate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Test public behavior
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Test browser workflows
        run: pnpm test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-node${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
