name: memory-weave

services:
  database:
    image: pgvector/pgvector:0.8.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: memory_weave
      POSTGRES_USER: memory_weave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(PGPASSWORD="$$POSTGRES_PASSWORD" PGCONNECT_TIMEOUT=2
          psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
          -X -w -v ON_ERROR_STOP=1 -Atqc
          "SELECT 1")" = 1
          || { echo 'Database is not ready: connection check failed.' >&2; exit 1; }
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    image: memory-weave:local
    restart: 'no'
    init: true
    command: [node, deploy/docker-entrypoint.mjs, migrate]
    depends_on:
      database:
        condition: service_healthy
    environment: &database-environment
      PGHOST: database
      PGPORT: '5432'
      PGDATABASE: memory_weave
      PGUSER: memory_weave
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}

  app:
    image: memory-weave:local
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-environment
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set an ADMIN_PASSWORD of at least 12 characters}
      APP_ORIGIN: ${DEPLOY_APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${DEPLOY_COOKIE_SECURE:-false}
      DATA_DIR: /app/data
      WEB_DIST_DIR: /app/web
    ports:
      - '${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-8080}:3000'
    volumes:
      - app-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  database-data:
  app-data:
