name: memory-weave

services:
  mysql:
    image: mysql:8.4.9
    restart: unless-stopped
    command:
      [
        --character-set-server=utf8mb4,
        --collation-server=utf8mb4_0900_bin,
        --default-time-zone=+00:00,
      ]
    environment:
      MYSQL_DATABASE: memory_weave
      MYSQL_USER: memory_weave
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run pnpm setup to configure MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run pnpm setup to configure MYSQL_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          CMD-SHELL,
          'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -Nse "SELECT 1" >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Run pnpm setup to configure QDRANT_API_KEY}
      QDRANT__TELEMETRY_DISABLED: 'true'
    ports:
      - '127.0.0.1:${QDRANT_PORT:-6333}:6333'
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; head -n 1 <&3 | grep -q " 200 "'''
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    image: memory-weave:local
    restart: 'no'
    init: true
    command: [node, deploy/docker-entrypoint.mjs, migrate]
    depends_on:
      mysql:
        condition: service_healthy
    environment: &database-environment
      MYSQL_HOST: mysql
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: memory_weave
      MYSQL_USER: memory_weave
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run pnpm setup}

  app:
    image: memory-weave:local
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: ../.env.models
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    environment:
      <<: *database-environment
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      CHAT_CONFIG_JSON: '${CHAT_CONFIG_JSON:-}'
      MEMORY_CONFIG_JSON: '${MEMORY_CONFIG_JSON:-}'
      RETRIEVAL_CONFIG_JSON: '${RETRIEVAL_CONFIG_JSON:-}'
      LIFECYCLE_BATCH_SIZE: '${LIFECYCLE_BATCH_SIZE:-100}'
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set an ADMIN_PASSWORD of at least 12 characters}
      APP_ORIGIN: ${DEPLOY_APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${DEPLOY_COOKIE_SECURE:-false}
      DATA_DIR: /app/data
      WEB_DIST_DIR: /app/web
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Run pnpm setup}
    ports:
      - '${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-8080}:3000'
    volumes:
      - app-data:/app/data
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  mysql-data:
  qdrant-data:
  qdrant-snapshots:
  app-data:
